<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Website Editor</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#5f6368;--line:#dadce0;--pnl:#f8f9fa;--cvb:#e8eaed;--acc:#1a73e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--pnl:#292a2d;--cvb:#171717;--acc:#8ab4f8}}
:root[data-theme="dark"]{--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--pnl:#292a2d;--cvb:#171717;--acc:#8ab4f8}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px Arial,Helvetica,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top,#fb{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;position:relative}
#fb{background:var(--pnl);padding:4px 12px}
.sp{flex:1}.mut{color:var(--mut);font-size:12px;margin-left:8px}.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
button,select,input[type=text],input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
button{cursor:pointer}button:hover:not(:disabled){background:var(--pnl)}button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#main{flex:1;display:flex;min-height:0}#left{flex:2;display:flex;flex-direction:column;min-width:0}
#cv{flex:1;overflow:auto;background:var(--cvb);padding:14px;display:flex;justify-content:center}
#fr{border:0;background:#fff;height:100%;box-shadow:0 1px 6px #0004;width:100%}#fr.t{width:768px}#fr.m{width:390px}
#side{flex:1;min-width:280px;max-width:420px;border-left:1px solid var(--line);overflow:auto;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:0;padding:12px;border-bottom:3px solid transparent;background:none}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:none}
.pn{padding:14px}.pn h4{margin:16px 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{text-align:left;padding:10px}
.pr{border:1px solid var(--line);border-radius:4px;padding:8px;margin:8px 0}.pr.cur{border-color:var(--acc)}.pr a{cursor:pointer;font-weight:bold}.pr span{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}.pr small{color:var(--mut)}.pr button{padding:2px 6px;font-size:12px}
.pop{position:absolute;right:12px;top:44px;width:300px;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #0003;padding:14px;z-index:20}
.pop label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}.pop input[type=text]{width:100%;box-sizing:border-box}.pop button{margin:6px 6px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{flex:1}
#gate{position:fixed;inset:0;background:var(--cvb);display:flex;align-items:center;justify-content:center;z-index:50}
#gf{background:var(--bg);border:1px solid var(--line);padding:28px;border-radius:8px;width:290px;display:flex;flex-direction:column;gap:10px}
</style></head><body>
<div id="gate"><div id="gf"><b>Website editor</b><input type="text" id="gr" placeholder="GitHub repository (username/repo)" autocomplete="off"><input type="password" id="gk" placeholder="GitHub token" autocomplete="off"><button class="pri" type="button" id="gb">Open editor</button><small id="ge" class="mut" style="margin:0"></small><small class="mut" style="margin:0">First time? See SETUP.txt, Step 4 (how to get a token).</small></div></div>
<div id="app" style="display:none"><div id="top"></div><div id="main"><div id="left"><div id="fb"></div><div id="cv"><iframe id="fr" title="Website preview"></iframe></div></div><aside id="side"></aside></div></div>
<input type="file" id="fi" accept="image/*" hidden>

const DEF={"site":{"name":"Multi Peeps","logo":"","desc":"Multi Peeps — Exploring Talents. A global creative community for ideas, collaboration, events and workshops."},"theme":{"--cream":"#fff9f1","--paper":"#fffdf9","--ink":"#242326","--muted":"#68656b","--coral":"#ff786b","--pink":"#ffd9e8","--lavender":"#ded6ff","--lime":"#d8f56a","--blue":"#cceaff","--yellow":"#ffe7a0","--line":"#e9e2d9","--display":"\"Space Grotesk\",sans-serif","--body":"\"DM Sans\",sans-serif"},"g":{"top":[{"id":"b1","h":"<div class=\"announcement\"><span class=\"pulse\"></span> A creative space for curious minds, everywhere.</div>"},{"id":"b2","h":"<header class=\"site-header\">\n    <a class=\"brand\" href=\"#home\" aria-label=\"Multi Peeps home\">\n      <span class=\"brand-mark\">mp<span>✳</span></span>\n      <span class=\"brand-name\">multi peeps<small>EXPLORING TALENTS</small></span>\n    </a>\n    <button class=\"menu-toggle\" aria-label=\"Open menu\" aria-expanded=\"false\">☰</button>\n    <nav class=\"nav\">\n      <a href=\"#about\">Our story</a><a href=\"#services\">What we do</a><a href=\"#events\">Events</a><a href=\"#workshops\">Workshops</a>\n      <a class=\"nav-cta\" href=\"#contact\">Let’s create <span>↗</span></a>\n    </nav>\n  </header>"}],"bottom":[{"id":"b12","h":"<footer class=\"footer\"><a class=\"brand footer-brand\" href=\"#home\"><span class=\"brand-mark\">mp<span>✳</span></span><span class=\"brand-name\">multi peeps<small>EXPLORING TALENTS</small></span></a><p>For the ideas you have.<br>And the ones you haven’t had yet.</p><div class=\"footer-links\"><a href=\"#about\">Our story</a><a href=\"#services\">Services</a><a href=\"#events\">Events</a><a href=\"#contact\">Contact</a></div><div class=\"footer-bottom\"><span>© <span id=\"year\"></span> Multi Peeps</span><span>MADE FOR THE CURIOUS ✳</span><a href=\"#home\">BACK TO TOP ↑</a></div></footer>"},{"id":"b13","h":"<div class=\"welcome-modal\" id=\"welcome-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\" aria-hidden=\"true\">\n    <div class=\"modal-backdrop\" data-close-modal=\"\"></div><div class=\"modal-card\"><button class=\"modal-close\" aria-label=\"Close welcome popup\" data-close-modal=\"\">×</button><span class=\"modal-spark\">✳</span><span class=\"eyebrow\">HEY, CURIOUS HUMAN</span><h2 id=\"modal-title\">You found<br>your <span class=\"serif-italic\">people.</span></h2><p>Explore a little. Ask questions. Bring your ideas along.</p><a class=\"button button-dark\" href=\"#services\" id=\"modal-explore\">Explore Multi Peeps <span>↗</span></a><small>ONE COMMUNITY. MANY WAYS TO CREATE.</small></div>\n  </div>"},{"id":"b14","h":"<div class=\"toast\" id=\"toast\" role=\"status\"><span>✳</span><div><b>Got an idea?</b><small>We’d love to hear about it.</small></div><button id=\"toast-close\" aria-label=\"Dismiss notification\">×</button></div>"}]},"pages":[{"id":"home","title":"Home","slug":"home","blocks":[{"id":"b3","h":"<section class=\"hero section\" id=\"home\">\n      <div class=\"hero-copy reveal\">\n        <div class=\"eyebrow\"><span class=\"eyebrow-dot\"></span> THE CREATIVE COMMUNITY</div>\n        <h1>BIG IDEAS.<br><span class=\"outlined\">REAL PEOPLE.</span><br><span class=\"accent-word\">YOUR SPACE.</span></h1>\n        <p class=\"hero-intro\">A home for curious minds, emerging talent and people who believe creativity gets better when we make things together.</p>\n        <div class=\"hero-actions\"><a class=\"button button-dark\" href=\"#services\">Explore what we do <span>↗</span></a><a class=\"text-link\" href=\"#events\">Find your next thing <span>↓</span></a></div>\n        <div class=\"hero-proof\"><div class=\"avatar-stack\"><img src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"><img src=\"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"><img src=\"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"></div><span>Different voices. Shared curiosity.</span></div>\n      </div>\n      <div class=\"hero-art reveal\">\n        <div class=\"hero-orbit\"></div>\n        <div class=\"photo photo-main\"><img src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=1000&amp;q=85\" alt=\"Friends sharing a creative moment\"></div>\n        <div class=\"photo photo-small\"><img src=\"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&amp;fit=crop&amp;w=500&amp;q=85\" alt=\"Creative team collaborating\"></div>\n        <div class=\"sticker sticker-pink\">MAKE<br>ROOM ✳</div>\n        <div class=\"sticker sticker-lime\">YOUR IDEAS<br>BELONG HERE</div>\n        <div class=\"floating-note\">✨ <b>Meet.</b> Make. Grow.</div>\n      </div>\n      <div class=\"hero-bottom\"><span>CREATIVITY HAS NO ONE WAY IN</span><span>SCROLL TO EXPLORE ↓</span></div>\n    </section>"},{"id":"b4","h":"<div class=\"marquee\" aria-label=\"Make things together\">\n      <div class=\"marquee-track\"><span>MAKE THINGS TOGETHER ✳</span><span>MEET YOUR PEOPLE ✳</span><span>EXPLORE YOUR TALENT ✳</span><span>MAKE THINGS TOGETHER ✳</span><span>MEET YOUR PEOPLE ✳</span><span>EXPLORE YOUR TALENT ✳</span></div>\n    </div>"},{"id":"b5","h":"<section class=\"section about-section\" id=\"about\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">01 / WHAT IS MULTI PEEPS?</span><span class=\"side-note\">A little less scrolling.<br>A little more creating.</span></div>\n      <div class=\"about-grid\">\n        <div class=\"about-title reveal\"><h2>Many talents.<br><span class=\"serif-italic\">One big</span> playground.</h2><div class=\"scribble\">✳</div></div>\n        <div class=\"about-content reveal\"><p class=\"big-copy\">Multi Peeps is a creative community built around people, ideas and possibilities.</p><p>We bring curious people together through creative services, events, workshops and collaborations—making more room for voices that deserve to be explored.</p><a href=\"#contact\" class=\"text-link\">Get to know us <span>↗</span></a></div>\n      </div>\n      <div class=\"about-photo-strip auto-slider\">\n        <div class=\"slider-track\">\n          <img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Friends connecting\">\n          <img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Creative collaboration\">\n          <img src=\"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People working together\">\n          <img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People sharing a meal\">\n          <img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Friends connecting\">\n          <img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Creative collaboration\">\n          <img src=\"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People working together\">\n          <img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People sharing a meal\">\n        </div>\n      </div>\n    </section>"},{"id":"b6","h":"<section class=\"section services-section\" id=\"services\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">02 / WHAT WE DO</span><span class=\"side-note\">Good ideas deserve<br>good people behind them.</span></div>\n      <div class=\"services-intro reveal\"><h2>Let’s make<br><span class=\"serif-italic\">something matter.</span></h2><p>From words to worlds, we help ideas find their shape and their audience.</p></div>\n      <div class=\"services-grid\">\n        <article class=\"service-card service-coral reveal\"><span class=\"service-number\">01</span><div class=\"service-icon\">✍</div><h3>Content writing</h3><p>Words with a point of view—built to connect with the people you want to reach.</p><a href=\"#contact\" data-service=\"Content writing\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-lavender reveal\"><span class=\"service-number\">02</span><div class=\"service-icon\">▤</div><h3>Publication support</h3><p>Thoughtful support for ideas taking their first steps towards publication.</p><a href=\"#contact\" data-service=\"Publication support\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-lime reveal\"><span class=\"service-number\">03</span><div class=\"service-icon\">✳</div><h3>Ghostwriting</h3><p>Your experience and voice, shaped into clear, compelling stories.</p><a href=\"#contact\" data-service=\"Ghostwriting\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-blue reveal\"><span class=\"service-number\">04</span><div class=\"service-icon\">文</div><h3>Translation</h3><p>Helping ideas travel across languages while keeping their meaning and spirit.</p><a href=\"#contact\" data-service=\"Translation\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-yellow reveal\"><span class=\"service-number\">05</span><div class=\"service-icon\">◉</div><h3>Content creation</h3><p>Creative concepts and visual storytelling for your next project.</p><a href=\"#contact\" data-service=\"Content creation\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-pink reveal\"><span class=\"service-number\">06</span><div class=\"service-icon\">↗</div><h3>Collaborations</h3><p>Open to partnering with creators, communities, brands and curious minds.</p><a href=\"#contact\" data-service=\"Creative collaborations\">Let’s collaborate <span>↗</span></a></article>\n      </div>\n      <p class=\"fine-print\">Publication support is being developed. Scope and availability will be confirmed for each inquiry.</p>\n    </section>"},{"id":"b7","h":"<section class=\"section events-section\" id=\"events\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">03 / EVENTS &amp; PARTICIPATION</span><span class=\"side-note\">Show up curious.<br>Leave with new possibilities.</span></div>\n      <div class=\"events-header reveal\"><div><h2>Your next chapter<br>could start <span class=\"serif-italic\">here.</span></h2><p>Join a gathering, take part in an activity or share an idea for something we should create next.</p></div><a class=\"button button-dark\" href=\"#register\">I’m interested <span>↗</span></a></div>\n      <div class=\"event-slider auto-slider\">\n        <div class=\"slider-track\">\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Creative event space\"><span class=\"tile-label\">MEET PEOPLE</span></article>\n          <article class=\"event-tile tile-short\"><img src=\"https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Community gathering\"><span class=\"tile-label\">SHARE IDEAS</span></article>\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Workshop attendees\"><span class=\"tile-label\">TRY SOMETHING NEW</span></article>\n          <article class=\"event-tile tile-short\"><img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"People connecting\"><span class=\"tile-label\">FIND YOUR PEOPLE</span></article>\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Creative event space\"><span class=\"tile-label\">MEET PEOPLE</span></article>\n          <article class=\"event-tile tile-short\"><img src=\"https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Community gathering\"><span class=\"tile-label\">SHARE IDEAS</span></article>\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Workshop attendees\"><span class=\"tile-label\">TRY SOMETHING NEW</span></article>\n          <article class=\"event-tile tile-short\"><img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"People connecting\"><span class=\"tile-label\">FIND YOUR PEOPLE</span></article>\n        </div>\n      </div>\n      <div class=\"register-panel reveal\" id=\"register\"><div class=\"register-sticker\">YOUR<br>TURN ↗</div><div><span class=\"eyebrow\">NEXT EVENT / PARTICIPATION</span><h3>Want to be part of it?</h3><p>Tell us you’re interested. We’ll share the next event details and registration link when it’s ready.</p></div><a class=\"button button-light\" href=\"#contact\" data-service=\"Event participation\">Register your interest <span>↗</span></a></div>\n      <p class=\"fine-print\">The live Google Form link will be added here before event registration opens.</p>\n    </section>"},{"id":"b8","h":"<section class=\"section workshops-section\" id=\"workshops\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">04 / WORKSHOPS &amp; RECOGNITION</span><span class=\"side-note\">Learn out loud.<br>Celebrate every step.</span></div>\n      <div class=\"workshop-grid\">\n        <div class=\"workshop-copy reveal\"><span class=\"eyebrow\">LEARN · MAKE · SHARE</span><h2>Curiosity is<br>a <span class=\"serif-italic\">skill.</span></h2><p>Workshops and masterclasses are a space to explore ideas, practise new skills and learn alongside others.</p><p class=\"muted\">This section is ready for your real workshop photos, participant highlights, certificates and appreciation moments.</p><a href=\"#contact\" class=\"button button-dark\" data-service=\"Workshop / masterclass\">Ask about workshops <span>↗</span></a></div>\n        <div class=\"workshop-visual reveal\"><img class=\"workshop-main-img\" src=\"https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&amp;fit=crop&amp;w=900&amp;q=85\" alt=\"People learning together\"><div class=\"certificate-card\"><div class=\"cert-star\">✳</div><small>MULTI PEEPS · RECOGNITION</small><strong>A little progress<br>is still progress.</strong><span>Sample visual — replace with an approved certificate.</span></div><div class=\"round-sticker\">KEEP<br>GROWING</div></div>\n      </div>\n      <div class=\"recognition-row\"><div><span class=\"phase\">COMMUNITY MOMENTS</span><h3>Small wins. Big energy.</h3></div><div class=\"recognition-slider auto-slider\"><div class=\"slider-track\">\n        <img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Students collaborating\"><img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Friends celebrating\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Teamwork\"><img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Students collaborating\"><img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Friends celebrating\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Teamwork\">\n      </div></div></div>\n      <p class=\"fine-print\">Sample imagery only. Add real participant photos and certificates only with permission; avoid publishing children's personal details.</p>\n    </section>"},{"id":"b9","h":"<section class=\"social-section section\">\n      <div class=\"social-head reveal\"><div><span class=\"phase\">THE COMMUNITY WALL</span><h2>Life lately, <span class=\"serif-italic\">in pixels.</span></h2></div><p>Snapshots of making, learning and being in the room together.</p></div>\n      <div class=\"social-grid reveal\">\n        <a href=\"#contact\" class=\"social-tile social-one\"><img src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Friends together\"><span>GOOD PEOPLE, GOOD ENERGY ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-two\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Creative team at work\"><span>IDEAS IN MOTION ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-three\"><img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"People learning together\"><span>LEARNING TOGETHER ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-four\"><img src=\"https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Community moment\"><span>MORE THAN A MEET-UP ↗</span></a>\n      </div>\n      <p class=\"social-note\">Add your Instagram handle and approved posts here before launch.</p>\n    </section>"},{"id":"b10","h":"<section class=\"faq-section section\" id=\"faq\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">GOOD TO KNOW</span><span class=\"side-note\">Questions are welcome.<br>Always.</span></div>\n      <div class=\"faq-layout\"><h2 class=\"reveal\">A few things<br>you might <span class=\"serif-italic\">wonder.</span></h2><div class=\"faq-list reveal\">\n        <details><summary>Who can be part of Multi Peeps? <span>＋</span></summary><p>Anyone curious about creativity, learning, collaboration or sharing their talents. Specific event requirements will be shared with each opportunity.</p></details>\n        <details><summary>How do I join an event? <span>＋</span></summary><p>Use the participation inquiry on this website. Once an event is announced, we’ll add its official registration link and details.</p></details>\n        <details><summary>Can I ask about a service or collaboration? <span>＋</span></summary><p>Absolutely. Choose the closest option in the inquiry form and tell us a little about what you have in mind.</p></details>\n        <details><summary>Are workshops and certificates available now? <span>＋</span></summary><p>Availability varies. Contact us for current plans. Any certificate examples shown on this page are illustrative placeholders, not issued credentials.</p></details>\n      </div></div>\n    </section>"},{"id":"b11","h":"<section class=\"contact-section section\" id=\"contact\">\n      <div class=\"contact-orb\"></div><div class=\"contact-copy reveal\"><span class=\"eyebrow\">GOT A THOUGHT? LET’S HEAR IT.</span><h2>Make your<br>move <span class=\"serif-italic\">with us.</span></h2><p>A project, a question, an event idea or a collaboration—start the conversation here.</p><div class=\"contact-small\">GOOD THINGS START WITH A HELLO ✳</div></div>\n      <form class=\"contact-form reveal\" id=\"inquiry-form\">\n        <label for=\"name\">Your name</label><input id=\"name\" name=\"name\" type=\"text\" placeholder=\"What should we call you?\" required=\"\">\n        <label for=\"email\">Email address</label><input id=\"email\" name=\"email\" type=\"email\" placeholder=\"you@example.com\" required=\"\">\n        <label for=\"service\">I’m reaching out about</label><select id=\"service\" name=\"service\" required=\"\"><option value=\"\">Choose a topic</option><option>Content writing</option><option>Publication support</option><option>Ghostwriting</option><option>Translation</option><option>Content creation</option><option>Creative collaborations</option><option>Event participation</option><option>Workshop / masterclass</option><option>Something else</option></select>\n        <label for=\"message\">A little about your idea</label><textarea id=\"message\" name=\"message\" rows=\"4\" placeholder=\"Tell us what you're thinking…\" required=\"\"></textarea>\n        <button class=\"button button-dark form-submit\" type=\"submit\">Send inquiry <span>↗</span></button>\n        <p class=\"form-note\">Demo form: it will not send until connected to a form service or backend.</p>\n        <p class=\"form-status\" id=\"form-status\" role=\"status\" aria-live=\"polite\"></p>\n      </form>\n    </section>"}]}]};

1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"><img src=\"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"><img src=\"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=100&amp;q=80\" alt=\"\"></div><span>Different voices. Shared curiosity.</span></div>\n      </div>\n      <div class=\"hero-art reveal\">\n        <div class=\"hero-orbit\"></div>\n        <div class=\"photo photo-main\"><img src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=1000&amp;q=85\" alt=\"Friends sharing a creative moment\"></div>\n        <div class=\"photo photo-small\"><img src=\"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&amp;fit=crop&amp;w=500&amp;q=85\" alt=\"Creative team collaborating\"></div>\n        <div class=\"sticker sticker-pink\">MAKE<br>ROOM ✳</div>\n        <div class=\"sticker sticker-lime\">YOUR IDEAS<br>BELONG HERE</div>\n        <div class=\"floating-note\">✨ <b>Meet.</b> Make. Grow.</div>\n      </div>\n      <div class=\"hero-bottom\"><span>CREATIVITY HAS NO ONE WAY IN</span><span>SCROLL TO EXPLORE ↓</span></div>\n    </section>"},{"k":"Your sections","l":"Scrolling text","z":"m","h":"<div class=\"marquee\" aria-label=\"Make things together\">\n      <div class=\"marquee-track\"><span>MAKE THINGS TOGETHER ✳</span><span>MEET YOUR PEOPLE ✳</span><span>EXPLORE YOUR TALENT ✳</span><span>MAKE THINGS TOGETHER ✳</span><span>MEET YOUR PEOPLE ✳</span><span>EXPLORE YOUR TALENT ✳</span></div>\n    </div>"},{"k":"Your sections","l":"About section","z":"m","h":"<section class=\"section about-section\" id=\"about\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">01 / WHAT IS MULTI PEEPS?</span><span class=\"side-note\">A little less scrolling.<br>A little more creating.</span></div>\n      <div class=\"about-grid\">\n        <div class=\"about-title reveal\"><h2>Many talents.<br><span class=\"serif-italic\">One big</span> playground.</h2><div class=\"scribble\">✳</div></div>\n        <div class=\"about-content reveal\"><p class=\"big-copy\">Multi Peeps is a creative community built around people, ideas and possibilities.</p><p>We bring curious people together through creative services, events, workshops and collaborations—making more room for voices that deserve to be explored.</p><a href=\"#contact\" class=\"text-link\">Get to know us <span>↗</span></a></div>\n      </div>\n      <div class=\"about-photo-strip auto-slider\">\n        <div class=\"slider-track\">\n          <img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Friends connecting\">\n          <img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Creative collaboration\">\n          <img src=\"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People working together\">\n          <img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People sharing a meal\">\n          <img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Friends connecting\">\n          <img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"Creative collaboration\">\n          <img src=\"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People working together\">\n          <img src=\"https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&amp;fit=crop&amp;w=600&amp;q=80\" alt=\"People sharing a meal\">\n        </div>\n      </div>\n    </section>"},{"k":"Your sections","l":"Services","z":"m","h":"<section class=\"section services-section\" id=\"services\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">02 / WHAT WE DO</span><span class=\"side-note\">Good ideas deserve<br>good people behind them.</span></div>\n      <div class=\"services-intro reveal\"><h2>Let’s make<br><span class=\"serif-italic\">something matter.</span></h2><p>From words to worlds, we help ideas find their shape and their audience.</p></div>\n      <div class=\"services-grid\">\n        <article class=\"service-card service-coral reveal\"><span class=\"service-number\">01</span><div class=\"service-icon\">✍</div><h3>Content writing</h3><p>Words with a point of view—built to connect with the people you want to reach.</p><a href=\"#contact\" data-service=\"Content writing\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-lavender reveal\"><span class=\"service-number\">02</span><div class=\"service-icon\">▤</div><h3>Publication support</h3><p>Thoughtful support for ideas taking their first steps towards publication.</p><a href=\"#contact\" data-service=\"Publication support\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-lime reveal\"><span class=\"service-number\">03</span><div class=\"service-icon\">✳</div><h3>Ghostwriting</h3><p>Your experience and voice, shaped into clear, compelling stories.</p><a href=\"#contact\" data-service=\"Ghostwriting\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-blue reveal\"><span class=\"service-number\">04</span><div class=\"service-icon\">文</div><h3>Translation</h3><p>Helping ideas travel across languages while keeping their meaning and spirit.</p><a href=\"#contact\" data-service=\"Translation\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-yellow reveal\"><span class=\"service-number\">05</span><div class=\"service-icon\">◉</div><h3>Content creation</h3><p>Creative concepts and visual storytelling for your next project.</p><a href=\"#contact\" data-service=\"Content creation\">Tell us your idea <span>↗</span></a></article>\n        <article class=\"service-card service-pink reveal\"><span class=\"service-number\">06</span><div class=\"service-icon\">↗</div><h3>Collaborations</h3><p>Open to partnering with creators, communities, brands and curious minds.</p><a href=\"#contact\" data-service=\"Creative collaborations\">Let’s collaborate <span>↗</span></a></article>\n      </div>\n      <p class=\"fine-print\">Publication support is being developed. Scope and availability will be confirmed for each inquiry.</p>\n    </section>"},{"k":"Your sections","l":"Events","z":"m","h":"<section class=\"section events-section\" id=\"events\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">03 / EVENTS &amp; PARTICIPATION</span><span class=\"side-note\">Show up curious.<br>Leave with new possibilities.</span></div>\n      <div class=\"events-header reveal\"><div><h2>Your next chapter<br>could start <span class=\"serif-italic\">here.</span></h2><p>Join a gathering, take part in an activity or share an idea for something we should create next.</p></div><a class=\"button button-dark\" href=\"#register\">I’m interested <span>↗</span></a></div>\n      <div class=\"event-slider auto-slider\">\n        <div class=\"slider-track\">\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Creative event space\"><span class=\"tile-label\">MEET PEOPLE</span></article>\n          <article class=\"event-tile tile-short\"><img src=\"https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&amp;fit=crop&amp;w=700&amp;q=85\" alt=\"Community gathering\"><span class=\"tile-label\">SHARE IDEAS</span></article>\n          <article class=\"event-tile tile-tall\"><img src=\"https://images.u  will be added here before event registration opens.</p>\n    </section>"},{"k":"Your sections","l":"Workshops","z":"m","h":"<section class=\"section workshops-section\" id=\"workshops\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">04 / WORKSHOPS &amp; RECOGNITION</span><span class=\"side-note\">Learn out loud.<br>Celebrate every step.</span></div>\n      <div class=\"workshop-grid\">\n        <div class=\"workshop-copy reveal\"><span class=\"eyebrow\">LEARN · MAKE · SHARE</span><h2>Curiosity is<br>a <span class=\"serif-italic\">skill.</span></h2><p>Workshops and masterclasses are a space to explore ideas, practise new skills and learn alongside others.</p><p class=\"muted\">This section is ready for your real workshop photos, participant highlights, certificates and appreciation moments.</p><a href=\"#contact\" class=\"button button-dark\" data-service=\"Workshop / masterclass\">Ask about workshops <span>↗</span></a></div>\n        <div class=\"workshop-visual reveal\"><img class=\"workshop-main-img\" src=\"https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&amp;fit=crop&amp;w=900&amp;q=85\" alt=\"People learning together\"><div class=\"certificate-card\"><div class=\"cert-star\">✳</div><small>MULTI PEEPS · RECOGNITION</small><strong>A little progress<br>is still progress.</strong><span>Sample visual — replace with an approved certificate.</span></div><div class=\"round-sticker\">KEEP<br>GROWING</div></div>\n      </div>\n      <div class=\"recognition-row\"><div><span class=\"phase\">COMMUNITY MOMENTS</span><h3>Small wins. Big energy.</h3></div><div class=\"recognition-slider auto-slider\"><div class=\"slider-track\">\n        <img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Students collaborating\"><img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Friends celebrating\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Teamwork\"><img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Students collaborating\"><img src=\"https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Friends celebrating\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=450&amp;q=80\" alt=\"Teamwork\">\n      </div></div></div>\n      <p class=\"fine-print\">Sample imagery only. Add real participant photos and certificates only with permission; avoid publishing children's personal details.</p>\n    </section>"},{"k":"Your sections","l":"Community wall","z":"m","h":"<section class=\"social-section section\">\n      <div class=\"social-head reveal\"><div><span class=\"phase\">THE COMMUNITY WALL</span><h2>Life lately, <span class=\"serif-italic\">in pixels.</span></h2></div><p>Snapshots of making, learning and being in the room together.</p></div>\n      <div class=\"social-grid reveal\">\n        <a href=\"#contact\" class=\"social-tile social-one\"><img src=\"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Friends together\"><span>GOOD PEOPLE, GOOD ENERGY ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-two\"><img src=\"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Creative team at work\"><span>IDEAS IN MOTION ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-three\"><img src=\"https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"People learning together\"><span>LEARNING TOGETHER ↗</span></a>\n        <a href=\"#contact\" class=\"social-tile social-four\"><img src=\"https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&amp;fit=crop&amp;w=650&amp;q=80\" alt=\"Community moment\"><span>MORE THAN A MEET-UP ↗</span></a>\n      </div>\n      <p class=\"social-note\">Add your Instagram handle and approved posts here before launch.</p>\n    </section>"},{"k":"Your sections","l":"FAQ","z":"m","h":"<section class=\"faq-section section\" id=\"faq\">\n      <div class=\"section-heading reveal\"><span class=\"phase\">GOOD TO KNOW</span><span class=\"side-note\">Questions are welcome.<br>Always.</span></div>\n      <div class=\"faq-layout\"><h2 class=\"reveal\">A few things<br>you might <span class=\"serif-italic\">wonder.</span></h2><div class=\"faq-list reveal\">\n        <details><summary>Who can be part of Multi Peeps? <span>＋</span></summary><p>Anyone curious about creativity, learning, collaboration or sharing their talents. Specific event requirements will be shared with each opportunity.</p></details>\n        <details><summary>How do I join an event? <span>＋</span></summary><p>Use the participation inquiry on this website. Once an event is announced, we’ll add its official registration link and details.</p></details>\n        <details><summary>Can I ask about a service or collaboration? <span>＋</span></summary><p>Absolutely. Choose the closest option in the inquiry form and tell us a little about what you have in mind.</p></details>\n        <details><summary>Are workshops and certificates available now? <span>＋</span></summary><p>Availability varies. Contact us for current plans. Any certificate examples shown on this page are illustrative placeholders, not issued credentials.</p></details>\n      </div></div>\n    </section>"},{"k":"Your sections","l":"Contact form","z":"m","h":"<section class=\"contact-section section\" id=\"contact\">\n      <div class=\"contact-orb\"></div><div class=\"contact-copy reveal\"><span class=\"eyebrow\">GOT A THOUGHT? LET’S HEAR IT.</span><h2>Make your<br>move <span class=\"serif-italic\">with us.</span></h2><p>A project, a question, an event idea or a collaboration—start the conversation here.</p><div class=\"contact-small\">GOOD THINGS START WITH A HELLO ✳</div></div>\n      <form class=\"contact-form reveal\" id=\"inquiry-form\">\n        <label for=\"name\">Your name</label><input id=\"name\" name=\"name\" type=\"text\" placeholder=\"What should we call you?\" required=\"\">\n        <label for=\"email\">Email address</label><input id=\"email\" name=\"email\" type=\"email\" placeholder=\"you@example.com\" required=\"\">\n        <label for=\"service\">I’m reaching out about</label><select id=\"service\" name=\"service\" required=\"\"><option value=\"\">Choose a topic</option><option>Content writing</option><option>Publication support</option><option>Ghostwriting</option><option>Translation</option><option>Content creation</option><option>Creative collaborations</option><option>Event participation</option><option>Workshop / masterclass</option><option>Something else</option></select>\n        <label for=\"message\">A little about your idea</label><textarea id=\"message\" name=\"message\" rows=\"4\" placeholder=\"Tell us what you're thinking…\" required=\"\"></textarea>\n        <button class=\"button button-dark form-submit\" type=\"submit\">Send inquiry <span>↗</span></button>\n        <p class=\"form-note\">Demo form: it will not send until connected to a form service or backend.</p>\n        <p class=\"form-status\" id=\"form-status\" role=\"status\" aria-live=\"polite\"></p>\n      </form>\n    </section>"},{"k":"Site parts","l":"Announcement bar","z":"t","h":"<div class=\"announcement\"><span class=\"pulse\"></span> A creative space for curious minds, everywhere.</div>"},{"k":"Site parts","l":"Header + menu","z":"t","h":"<header class=\"site-header\">\n    <a class=\"brand\" href=\"#home\" aria-label=\"Multi Peeps home\">\n      <span class=\"brand-mark\">mp<span>✳</span></span>\n      <span class=\"brand-name\">multi peeps<small>EXPLORING TALENTS</small></span>\n    </a>\n    <button class=\"menu-toggle\" aria-label=\"Open menu\" aria-expanded=\"false\">☰</button>\n    <nav class=\"nav\">\n      <a href=\"#about\">Our story</a><a href=\"#services\">What we do</a><a href=\"#events\">Events</a><a href=\"#workshops\">Workshops</a>\n      <a class=\"nav-cta\" href=\"#contact\">Let’s create <span>↗</span></a>\n    </nav>\n  </header>"},{"k":"Site parts","l":"Footer","z":"b","h":"<footer class=\"footer\"><a class=\"brand footer-brand\" href=\"#home\"><span class=\"brand-mark\">mp<span>✳</span></span><span class=\"brand-name\">multi peeps<small>EXPLORING TALENTS</small></span></a><p>For the ideas you have.<br>And the ones you haven’t had yet.</p><div class=\"footer-links\"><a href=\"#about\">Our story</a><a href=\"#services\">Services</a><a href=\"#events\">Events</a><a href=\"#contact\">Contact</a></div><div class=\"footer-bottom\"><span>© <span id=\"year\"></span> Multi Peeps</span><span>MADE FOR THE CURIOUS ✳</span><a href=\"#home\">BACK TO TOP ↑</a></div></footer>"},{"k":"Site parts","l":"Welcome popup","z":"b","h":"<div class=\"welcome-modal\" id=\"welcome-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\" aria-hidden=\"true\">\n    <div class=\"modal-backdrop\" data-close-modal=\"\"></div><div class=\"modal-card\"><button class=\"modal-close\" aria-label=\"Close welcome popup\" data-close-modal=\"\">×</button><span class=\"modal-spark\">✳</span><span class=\"eyebrow\">HEY, CURIOUS HUMAN</span><h2 id=\"modal-title\">You found<br>your <span class=\"serif-italic\">people.</span></h2><p>Explore a little. Ask questions. Bring your ideas along.</p><a class=\"button button-dark\" href=\"#services\" id=\"modal-explore\">Explore Multi Peeps <span>↗</span></a><small>ONE COMMUNITY. MANY WAYS TO CREATE.</small></div>\n  </div>"},{"k":"Site parts","l":"Toast message","z":"b","h":"<div class=\"toast\" id=\"toast\" role=\"status\"><span>✳</span><div><b>Got an idea?</b><small>We’d love to hear about it.</
